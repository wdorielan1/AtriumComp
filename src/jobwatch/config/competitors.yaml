# Competitors to watch.
#
#   name:        display name (used in email / dashboard)
#   homepage:    company site. If careers_url is missing, or returns no jobs,
#                the scraper looks for a "Jobs" / "Careers" link on this page.
#   careers_url: (optional) the job-listing page, if you know it
#   type:        (optional) force an adapter: generic | teamtailor | greenhouse |
#                lever | workable | smartrecruiters | bullhorn | rss
#   board:       (optional) the account/board id the adapter needs
#                (e.g. greenhouse board token, teamtailor subdomain)
#   max_pages:   (optional) how many listing pages to follow (default 5)
#   enabled:     set false to skip
#   verify:      true = URL is a best guess; run `python -m jobwatch.cli discover`
#                to confirm the scraper finds jobs, then fix the URL if needed.
#   suggested:   true (with enabled: false) = listed on the dashboard's Competitors tab,
#                greyed out with an "Add" button, but not tracked until you add it.
#
# You don't have to edit this file to add or pause competitors: use the dashboard's
# Competitors tab. This file is the starting list.
#
# Do not add LinkedIn URLs: LinkedIn blocks scraping and its terms forbid it.

