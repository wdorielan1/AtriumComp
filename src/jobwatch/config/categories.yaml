# Which postings count as a match, how they are labelled, and which ones Claude
# decodes automatically.
#
# Matching is case-insensitive on whole words/phrases. A job matches a category
# when a title keyword hits, or when at least `min_description_hits` description
# keywords hit (descriptions are noisy, so titles count more).
# `fallback: true` categories use broad words ("scientist") and only apply when
# no other category matched, so a "Clinical Research Associate" is Clinical only.
#
# Edit freely; changes apply on the next run.

min_description_hits: 3

categories:
  Clinical:
    title:
      - clinical research
      - clinical operations
      - clinical trial
      - clinical study
      - clinical project
      - clinical program
      - clinical development
      - clinical scientist
      - clinical data
      - clinical supply
      - CRA
      - CTA
      - CTM
      - CRC
      - clinical research associate
      - clinical research coordinator
      - clinical trial manager
      - clinical trial associate
      - study manager
      - study start-up
      - site manager
      - site monitor
      - monitor
      - biostatistic
      - biostatistician
      - statistical programmer
      - SAS programmer
      - data manager
      - clinical data manager
      - feasibility
      - TMF
    description:
      - GCP
      - ICH
      - clinical trial
