# A job only counts if it also looks like life-sciences work. When a title
# matches a category but nothing below appears anywhere in the posting, it is
# dropped (filters out e.g. "QA Engineer" at a software company).
industry_signals:
  - pharma
  - pharmaceutical
  - biotech
  - biotechnology
  - biopharma
  - life science
  - life sciences
  - clinical
  - medical
  - drug
  - therapeutic
  - therapy
  - oncology
  - vaccine
  - biologics
  - GMP
  - GCP
  - FDA
  - CRO
  - CDMO
  - medical device
  - diagnostics
  - laboratory
  - patients
  - molecule

# Competitors advertise their own internal hiring on the same boards.
# Postings whose title matches these are skipped.
exclude_titles:
  - recruiter
  - recruitment consultant
  - recruitment manager
  - talent acquisition
  - sourcer
  - resourcer
  - business development manager
  - account manager - staffing
  - sales recruiter
  - associate consultant
  - delivery manager

# Employment-type detection (temp vs direct hire). Structured data from the
# site (JSON-LD employmentType) wins when present. Otherwise any
# Contract-to-hire phrase wins; else the type with the most hits (title hits
# count 3x) wins. Phrases like "contract research organization" are ignored.
# Claude double-checks during the decode step.
employment_types:
  Contract-to-hire:
    - contract to hire
    - contract-to-hire
    - temp to perm
    - temp-to-perm
    - temp to hire
    - CTH
    - right to hire
  Temp / Contract:
    - contract
    - contractor
    - temporary
    - temp
    - W2
    - 1099
    - C2C
    - corp to corp
    - per hour
    - /hr
    - hourly
    - month assignment
    - months assignment
    - interim
    - freelance
    - consultant role
  Direct hire:
    - direct hire
    - direct-hire
    - permanent
    - perm
    - full-time employee
    - base salary
    - annual salary
    - per year
    - /yr
    - bonus
    - equity
    - 401k

# Which matching postings Claude decodes automatically (decoding is what costs
# money). A posting is auto-decoded only if it passes every list below; an
# empty list means "any". Everything else can be decoded on demand with the
# "Decode" button on the dashboard.
#   employment_types: Direct hire | Contract-to-hire | Temp / Contract | Unknown
#   categories:       names from the categories section above
#   competitors:      names from competitors.yaml
auto_decode:
  employment_types: [Direct hire]
  categories: [Clinical, Medical Affairs]
  competitors: []
